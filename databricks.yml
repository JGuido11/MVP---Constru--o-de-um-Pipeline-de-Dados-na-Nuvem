bundle:
  name: urban-mobility
variables:
  catalog:
    default: workspace
  schema_prefix:
    default: mobility
sync:
  include:
    - src/**
    - sql/**
    - notebooks/**
resources:
  jobs:
    pipeline:
      name: mobility-pipeline
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: pipeline
          timeout_seconds: 21600
          notebook_task:
            notebook_path: ./notebooks/01_run_pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              project_root: ${workspace.file_path}
              source_months: '2026-01,2026-02,2026-03'
              source_mode: volume
              run_id: '{{job.run_id}}'
targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
