version: 2
sources:
  - name: silver
    database: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
    schema: "{{ env_var('MOBILITY_SCHEMA_PREFIX', 'mobility') }}_silver"
    tables:
      - name: trips
        description: Accepted trip records; genuine duplicate records are preserved.
      - name: rejected_trips
        description: Invalid records with rejection reason arrays.
      - name: taxi_zones
        description: Taxi zone lookup snapshots, keyed by source month and zone ID.
  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
    schema: "{{ env_var('MOBILITY_SCHEMA_PREFIX', 'mobility') }}_bronze"
    tables:
      - name: yellow_trips
  - name: ops
    database: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
    schema: "{{ env_var('MOBILITY_SCHEMA_PREFIX', 'mobility') }}_ops"
    tables:
      - name: month_status
      - name: connectivity_probe
